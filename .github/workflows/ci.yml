name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Cancel the older run when pushes to the same branch pile up (saves runner time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Translation check: are the language lists consistent, does every language
      # have all strings, do format specifiers match? Takes seconds, runs before Gradle.
      - name: Check multilingual strings
        run: python3 tools/check_strings.py

      - name: Check website
        run: python3 tools/check_site.py

      # Play texts: character limits, all 14 languages, invisible characters.
      - name: Check store listing texts
        run: python3 tools/check_store.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (decoder, ISBN/ISSN, content, CSV)
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kodokur-test-reports
          path: |
            core/build/reports/tests
            core/build/test-results

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kodokur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
