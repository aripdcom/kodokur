name: Pages

# site/ klasörünü GitHub Pages'e yayınlar: https://kodokur.aripd.com
# (aripdcom.github.io/kodokur oraya yönlenir). Depo ayarlarında Pages kaynağı
# "GitHub Actions", alan adı Settings → Pages'te tanımlı. Alan adı değişirse
# platform/Actions.kt, site/index.html, tools/gen_privacy.py ve
# tools/check_site.py'deki adresler birlikte güncellenir.

on:
  push:
    # github-pages ortamı yalnızca varsayılan daldan (main) dağıtıma izin verir.
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
